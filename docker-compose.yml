version: '3.8'

services:
  chatppt:
    build: .
    container_name: chatppt
    ports:
      - "7860:7860"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - ./outputs:/app/outputs
      - ./templates:/app/templates
      - ./prompts:/app/prompts
    restart: unless-stopped
    networks:
      - chatppt-network

networks:
  chatppt-network:
    driver: bridge

